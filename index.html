<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Took It">
<title>Took It</title>
<style>
:root {
  --bg: #1e3a2f;
  --card: #274a3c;
  --card2: #32604d;
  --txt: #f3f7f2;
  --dim: #b5cbbd;
  --acc: #8fd9b0;
  --warn: #f5c46b;
  --danger: #f0a0a0;
  --ink: #0f241c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--txt);
  font: 600 20px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 44px; line-height: 1.05; margin: 8px 0 4px; font-weight: 900; }
.sub { color: var(--dim); font-size: 18px; margin: 0 0 18px; }
button, .btn {
  display: block; width: 100%; border: 0; border-radius: 22px;
  padding: 18px 16px; margin: 10px 0;
  font: 800 24px/1.2 system-ui, sans-serif;
  color: var(--ink); background: var(--acc); cursor: pointer;
  touch-action: manipulation; text-align: center; text-decoration: none;
}
button:disabled { opacity: 0.45; }
button:focus-visible, .btn:focus-visible { outline: 4px solid var(--warn); outline-offset: 3px; }
.tap {
  font-size: 40px; padding: 56px 18px; margin: 20px 0 12px;
  border-radius: 28px; background: var(--acc);
  box-shadow: 0 10px 0 #5aa882;
  transition: transform 0.08s, box-shadow 0.08s;
}
.tap:active { transform: translateY(6px); box-shadow: 0 4px 0 #5aa882; }
.ghost { background: var(--card2); color: var(--txt); }
.warnb { background: var(--warn); }
.danger { background: var(--danger); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.card {
  background: var(--card); border-radius: 22px;
  padding: 14px 16px; margin: 12px 0;
}
.hide { display: none !important; }
.center { text-align: center; }
.status { color: var(--dim); font-size: 17px; min-height: 1.3em; margin: 6px 0; }
.badge {
  display: inline-block; background: var(--acc); color: var(--ink);
  font-weight: 900; font-size: 18px; padding: 6px 14px; border-radius: 999px;
  margin: 4px 0 12px;
}
.badge.miss { background: var(--warn); }
#previewWrap {
  background: #102018; border-radius: 20px; overflow: hidden;
  margin: 10px 0; aspect-ratio: 3/4; max-height: 55vh;
  display: flex; align-items: center; justify-content: center;
}
#preview, #shot {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
#placeholder { color: var(--dim); font-size: 20px; padding: 20px; text-align: center; }
.entry {
  display: flex; gap: 12px; align-items: center;
  background: var(--card2); border-radius: 16px;
  padding: 10px; margin: 8px 0;
}
.entry img {
  width: 72px; height: 72px; object-fit: cover; border-radius: 12px;
  background: #102018; flex-shrink: 0;
}
.entry .meta { flex: 1; min-width: 0; }
.entry .when { font-size: 22px; font-weight: 800; }
.entry .note { color: var(--dim); font-size: 16px; }
.entry .del {
  width: auto; margin: 0; padding: 10px 14px; font-size: 16px;
  background: transparent; color: var(--danger); border: 2px solid var(--danger);
  border-radius: 14px;
}
.file-btn { position: relative; overflow: hidden; }
.file-btn input {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 100px;
}
.empty { color: var(--dim); font-size: 20px; text-align: center; padding: 24px 8px; }
footer { text-align: center; color: var(--dim); font-size: 15px; margin: 28px 0 8px; }
#noteIn {
  width: 100%; border: 0; border-radius: 16px; padding: 14px 16px;
  font: 600 20px system-ui, sans-serif; background: var(--card2); color: var(--txt);
  margin: 8px 0;
}
</style>
</head>
<body>
<main>
  <h1>Took It</h1>
  <p class="sub">One tap when you take your pill. Family can check Today.</p>

  <div id="homeView">
    <div class="center" id="todayBadge"></div>
    <button type="button" class="tap" id="btnTook">Took it</button>
    <p class="status center" id="homeStatus">Tap once after you take your medicine.</p>
    <button type="button" class="ghost" id="btnToday">Today</button>
    <button type="button" class="ghost" id="btnHistory">All days</button>
  </div>

  <div id="captureView" class="hide">
    <div id="previewWrap">
      <p id="placeholder">Camera opening…</p>
      <video id="preview" class="hide" playsinline muted autoplay></video>
      <img id="shot" class="hide" alt="Pill photo">
    </div>
    <input type="text" id="noteIn" maxlength="80" placeholder="Optional note (e.g. morning)">
    <p class="status" id="capStatus"></p>
    <button type="button" class="tap" id="btnSnap" style="font-size:32px;padding:28px 16px;margin:8px 0;">Snap</button>
    <div class="row">
      <label class="btn ghost file-btn">
        Photo library
        <input type="file" id="fileIn" accept="image/*" capture="environment">
      </label>
      <button type="button" class="ghost" id="btnSkipPhoto">Save without photo</button>
    </div>
    <button type="button" class="ghost" id="btnCancelCap">Cancel</button>
  </div>

  <div id="listView" class="hide">
    <h2 id="listTitle" style="font-size:28px;margin:8px 0;">Today</h2>
    <div id="list"></div>
    <button type="button" class="ghost" id="btnBack">Back</button>
    <button type="button" class="danger hide" id="btnClearOld">Clear entries older than 30 days</button>
  </div>
</main>
<footer>Private on this phone. Nothing leaves the device. Equal always.</footer>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const KEY = 'tookit.v1';
  const MAX_ENTRIES = 200;
  const MAX_PHOTO_CHARS = 180000; // ~keep localStorage happy
  const MAX_DIM = 720;
  const JPEG_Q = 0.72;

  const preview = $('#preview');
  const shot = $('#shot');
  const placeholder = $('#placeholder');
  let stream = null;
  let pendingDataUrl = null;
  let listMode = 'today';

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { entries: [] };
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.entries)) return { entries: [] };
      return data;
    } catch {
      return { entries: [] };
    }
  }

  function save(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (err) {
      // Quota: strip photos from oldest until it fits
      const copy = { entries: data.entries.map((e) => ({ ...e })) };
      for (let i = 0; i < copy.entries.length; i++) {
        if (copy.entries[i].photo) {
          delete copy.entries[i].photo;
          try {
            localStorage.setItem(KEY, JSON.stringify(copy));
            return true;
          } catch (_) { /* keep stripping */ }
        }
      }
      alert('Storage full. Saved time only — photo skipped.');
      const bare = { entries: data.entries.map((e) => ({ id: e.id, at: e.at, note: e.note || '' })) };
      try { localStorage.setItem(KEY, JSON.stringify(bare)); return true; } catch { return false; }
    }
  }

  function show(el) { el.classList.remove('hide'); }
  function hide(el) { el.classList.add('hide'); }

  function dayKey(d) {
    const x = new Date(d);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function formatDay(ts) {
    return new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function todayEntries() {
    const today = dayKey(Date.now());
    return load().entries.filter((e) => dayKey(e.at) === today).sort((a, b) => b.at - a.at);
  }

  function refreshBadge() {
    const n = todayEntries().length;
    const el = $('#todayBadge');
    if (n === 0) {
      el.innerHTML = '<span class="badge miss">Not logged today yet</span>';
    } else if (n === 1) {
      el.innerHTML = '<span class="badge">Took it once today · ' + formatTime(todayEntries()[0].at) + '</span>';
    } else {
      el.innerHTML = '<span class="badge">Took it ' + n + ' times today · last ' + formatTime(todayEntries()[0].at) + '</span>';
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    preview.srcObject = null;
  }

  async function openCapture() {
    pendingDataUrl = null;
    $('#noteIn').value = '';
    $('#capStatus').textContent = '';
    hide($('#homeView'));
    hide($('#listView'));
    show($('#captureView'));
    hide(shot);
    hide(preview);
    show(placeholder);
    placeholder.textContent = 'Opening camera…';
    show($('#btnSnap'));

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      placeholder.textContent = 'No camera — use Photo library or Save without photo.';
      hide($('#btnSnap'));
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }
      });
      preview.srcObject = stream;
      hide(placeholder);
      show(preview);
      $('#capStatus').textContent = 'Snap the bottle or your hand with the pill.';
    } catch (err) {
      placeholder.textContent = 'Camera blocked. Use Photo library or Save without photo.';
      hide($('#btnSnap'));
      console.warn(err);
    }
  }

  function compressToDataUrl(source) {
    return new Promise((resolve) => {
      const img = source instanceof HTMLImageElement || source instanceof HTMLVideoElement
        ? source
        : null;
      const draw = (w0, h0, drawer) => {
        let w = w0, h = h0;
        if (w > MAX_DIM || h > MAX_DIM) {
          const s = MAX_DIM / Math.max(w, h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, w);
        canvas.height = Math.max(1, h);
        drawer(canvas.getContext('2d'), canvas.width, canvas.height);
        let q = JPEG_Q;
        let url = canvas.toDataURL('image/jpeg', q);
        while (url.length > MAX_PHOTO_CHARS && q > 0.4) {
          q -= 0.1;
          url = canvas.toDataURL('image/jpeg', q);
        }
        if (url.length > MAX_PHOTO_CHARS) resolve(null);
        else resolve(url);
      };

      if (source instanceof HTMLVideoElement) {
        draw(source.videoWidth || 640, source.videoHeight || 640, (ctx, w, h) => ctx.drawImage(source, 0, 0, w, h));
        return;
      }
      if (source instanceof HTMLCanvasElement) {
        draw(source.width, source.height, (ctx, w, h) => ctx.drawImage(source, 0, 0, w, h));
        return;
      }
      const image = new Image();
      image.onload = () => draw(image.naturalWidth, image.naturalHeight, (ctx, w, h) => ctx.drawImage(image, 0, 0, w, h));
      image.onerror = () => resolve(null);
      if (typeof source === 'string') image.src = source;
      else if (source instanceof Blob) image.src = URL.createObjectURL(source);
      else resolve(null);
    });
  }

  async function snapFromCamera() {
    if (!stream) return;
    $('#capStatus').textContent = 'Saving…';
    const url = await compressToDataUrl(preview);
    stopCamera();
    hide(preview);
    if (url) {
      pendingDataUrl = url;
      shot.src = url;
      show(shot);
      hide(placeholder);
    } else {
      pendingDataUrl = null;
      show(placeholder);
      placeholder.textContent = 'Photo too large — saving time only.';
    }
    await commitEntry();
  }

  async function fromFile(file) {
    if (!file) return;
    stopCamera();
    $('#capStatus').textContent = 'Saving…';
    const url = await compressToDataUrl(file);
    pendingDataUrl = url;
    if (url) {
      shot.src = url;
      hide(preview);
      hide(placeholder);
      show(shot);
    }
    await commitEntry();
  }

  async function commitEntry() {
    const note = ($('#noteIn').value || '').trim();
    const data = load();
    const entry = {
      id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      at: Date.now(),
      note: note
    };
    if (pendingDataUrl) entry.photo = pendingDataUrl;
    data.entries.unshift(entry);
    if (data.entries.length > MAX_ENTRIES) data.entries = data.entries.slice(0, MAX_ENTRIES);
    const ok = save(data);
    stopCamera();
    hide($('#captureView'));
    show($('#homeView'));
    refreshBadge();
    $('#homeStatus').textContent = ok
      ? ('Logged at ' + formatTime(entry.at) + (entry.photo ? ' with photo.' : '.'))
      : 'Could not save. Storage may be full.';
  }

  function goHome() {
    stopCamera();
    hide($('#captureView'));
    hide($('#listView'));
    show($('#homeView'));
    refreshBadge();
  }

  function renderList(mode) {
    listMode = mode;
    const data = load();
    const today = dayKey(Date.now());
    let entries = data.entries.slice().sort((a, b) => b.at - a.at);
    if (mode === 'today') {
      entries = entries.filter((e) => dayKey(e.at) === today);
      $('#listTitle').textContent = 'Today';
      hide($('#btnClearOld'));
    } else {
      $('#listTitle').textContent = 'All days';
      show($('#btnClearOld'));
    }
    const list = $('#list');
    if (!entries.length) {
      list.innerHTML = '<p class="empty">' + (mode === 'today' ? 'Nothing logged today yet.' : 'No entries yet.') + '</p>';
      return;
    }
    list.innerHTML = entries.map((e) => {
      const thumb = e.photo
        ? '<img src="' + e.photo + '" alt="">'
        : '<img alt="" style="background:#32604d">';
      const note = e.note ? '<div class="note">' + escapeHtml(e.note) + '</div>' : '';
      const when = mode === 'today'
        ? formatTime(e.at)
        : (formatDay(e.at) + ' · ' + formatTime(e.at));
      return '<div class="entry" data-id="' + e.id + '">' +
        thumb +
        '<div class="meta"><div class="when">' + when + '</div>' + note + '</div>' +
        '<button type="button" class="del" data-del="' + e.id + '">Delete</button>' +
        '</div>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function openList(mode) {
    stopCamera();
    hide($('#homeView'));
    hide($('#captureView'));
    show($('#listView'));
    renderList(mode);
  }

  $('#list').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-del]');
    if (!btn) return;
    const id = btn.getAttribute('data-del');
    if (!confirm('Delete this entry?')) return;
    const data = load();
    data.entries = data.entries.filter((e) => e.id !== id);
    save(data);
    renderList(listMode);
    refreshBadge();
  });

  $('#btnTook').onclick = openCapture;
  $('#btnSnap').onclick = snapFromCamera;
  $('#btnSkipPhoto').onclick = () => { pendingDataUrl = null; commitEntry(); };
  $('#btnCancelCap').onclick = goHome;
  $('#btnToday').onclick = () => openList('today');
  $('#btnHistory').onclick = () => openList('all');
  $('#btnBack').onclick = goHome;
  $('#fileIn').onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) fromFile(f);
  };
  $('#btnClearOld').onclick = () => {
    if (!confirm('Remove entries older than 30 days?')) return;
    const cut = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const data = load();
    data.entries = data.entries.filter((e) => e.at >= cut);
    save(data);
    renderList('all');
    refreshBadge();
  };

  refreshBadge();
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
